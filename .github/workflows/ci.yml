name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        # Single source of dep truth: pyproject.toml + uv.lock. `uv sync` installs
        # core (PyYAML) + the [dependency-groups].dev group (pydantic, jinja2,
        # ruff==0.12.12 — the light half the suite/render need). The heavy [llm]
        # extra is NOT synced. Replaces the old hand-maintained `pip install` list,
        # killing pyproject↔CI drift. uv provisions the interpreter itself.
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        # The missing merge gate: lint debt used to accumulate silently because only
        # the opt-in /v3-review tool gate ran ruff. The generated plugin bundle is
        # excluded in ruff.toml (byte-identical mirror; build --check enforces equality).
        run: uv run ruff check .

      - name: Prepare Claude home
        run: |
          mkdir -p ~/.claude/hooks/lib ~/.local/bin
          cp hooks/*.py ~/.claude/hooks/
          cp hooks/lib/*.py ~/.claude/hooks/lib/
          chmod +x ~/.claude/hooks/*.py
          cat > ~/.claude/settings.json <<'SETTINGS'
          {
            "hooks": {
              "PreToolUse": [
                {
                  "matcher": "Edit|Write|MultiEdit|Bash",
                  "hooks": [
                    {
                      "type": "command",
                      "command": "python3 ~/.claude/hooks/check-requirements.py",
                      "timeout": 5
                    }
                  ]
                }
              ]
            }
          }
          SETTINGS
          cp examples/global-requirements.yaml ~/.claude/requirements.yaml

      - name: Run doctor check
        run: uv run python hooks/requirements-cli.py doctor --ci --repo "$(pwd)"

      - name: Run test suite
        run: uv run python hooks/test_requirements.py

      - name: Check rendered prompts are fresh
        # Fails if any *.md rendered sibling is stale vs its *.md.j2 source.
        # jinja2 comes from the dev group synced above.
        run: uv run python scripts/render_prompts.py --check

      - name: Run V3 tests/ suite
        # Script-style suite (each file has its own TestRunner/main(), NOT pytest).
        # Heavy-dep files (Claude Agent SDK, OTel, etc.) self-skip cleanly when the
        # optional [llm] extras are absent — only the light dev group is synced in
        # CI. Aggregate exit codes so one failing file fails the job.
        env:
          PYTHONDONTWRITEBYTECODE: 1
        run: |
          rc=0
          for f in tests/test_*.py; do
            echo "== $f =="
            uv run python "$f" || rc=1
          done
          exit $rc
