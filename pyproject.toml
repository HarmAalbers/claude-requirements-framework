[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-requirements-framework"
version = "4.0.0"
description = "Claude Code requirements framework — workflow gates, hooks, and V3 LLM platform."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Harm Aalbers" }]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# V3 LLM platform deps. Substrate is `claude-agent-sdk` (inherits Claude Max auth
# from the bundled CLI subprocess); no direct Anthropic SDK use. See ADR-016.
llm = [
    "claude-agent-sdk>=0.2.82",
    "jinja2>=3.1",
    "langfuse>=3.0",
    "openinference-instrumentation-claude-agent-sdk>=0.1",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "qdrant-client>=1.12",
    "sentence-transformers>=3.0",
    "llama-index-core>=0.12",
    "llama-index-vector-stores-qdrant>=0.4",
    "ragas>=0.2",
    "tiktoken>=0.8",
]

[dependency-groups]
# Lightweight build/test tooling — auto-synced by `uv run`/`uv sync` (no --extra needed).
# pydantic + jinja2 are the "light half" of the [llm] extra that the build (template
# rendering) and the in-suite V3 tests import directly; declared here so they don't drag
# in the heavy llm stack (torch/sentence-transformers/ragas). pydantic was previously a
# direct-but-undeclared import. ruff is pinned so a new release can't flag unchanged code.
dev = [
    "pydantic>=2",
    "jinja2>=3.1",
    "ruff==0.12.12",
]

[tool.setuptools]
packages = ["hooks.lib.llm", "hooks.lib.llm.workers"]
