version: '1.0'
enabled: true
# Gates advise rather than deny; set to 'block' to enforce.
enforcement: nudge
requirements:
  # Validate team gate: the architecture-review team (adr-guardian,
  # solid-reviewer, tdd-validator, commit-planner, refactor-advisor,
  # backward-compatibility-checker) satisfies ONE gate on completion. This
  # replaces the old commit_plan / adr_reviewed / tdd_planned / solid_reviewed
  # sub-gates (all owned by arch-review) with a single team gate.
  plan_validated:
    enabled: true
    type: blocking
    scope: session
    description: "Ensures the plan passed the architecture-review team (ADR alignment, SOLID, TDD-readiness, commit plan)."
    trigger_tools:
    - Edit
    - Write
    - MultiEdit
    auto_resolve_skill: "requirements-framework:arch-review"
    satisfied_by_skill: "requirements-framework:arch-review"
    message: |
      ## Blocked: plan_validated

      **Execute**: `/{auto_resolve_skill}`

      Team-based architecture review: ADR alignment, SOLID, TDD-readiness, and commit planning, cross-validated.
    checklist:
    - Plan reviewed against ADRs
    - SOLID principles checked (Single Responsibility, Open/Closed, Dependency Inversion)
    - TDD strategy documented (tests-first per feature)
    - Atomic commit boundaries planned
  protected_branch:
    enabled: true
    type: guard
    guard_type: protected_branch
    description: "Prevents direct edits on main/master branches."
    protected_branches:
    - master
    - main
    trigger_tools:
    - Edit
    - Write
    - MultiEdit
    message: |
      ## Blocked: protected_branch

      Cannot edit files on protected branch `{branch}`.

      **Actions**:
      1. Create feature branch: `git checkout -b feature/your-feature-name`
      2. Emergency override: `req approve protected_branch`
    checklist:
    - Confirmed not on protected branch (master/main)
    - Feature branch created for changes
  branch_size_limit:
    enabled: true
    type: dynamic
    calculator: branch_size_calculator
    description: "Automatically calculates branch size and enforces PR size limits."
    scope: session
    trigger_tools:
    - Edit
    - Write
    - MultiEdit
    cache_ttl: 60
    approval_ttl: 3600
    thresholds:
      warn: 250
      block: 400
    blocking_message: |
      ## Blocked: branch_size_limit

      Branch has **{total}** line changes (limit: {block_threshold}).

      {summary}

      **Recommendation**: Split into smaller, focused PRs after this session.

      ---
      Override: `req approve branch_size_limit`
  single_session_per_project:
    enabled: true
    type: guard
    guard_type: single_session
    description: "Prevents multiple sessions from editing the same project simultaneously."
    scope: session
    trigger_tools:
      - Edit
      - Write
      - MultiEdit
    message: |
      ## Blocked: single_session_per_project

      Another Claude Code session is active on this project.

      **Actions**:
      1. Close the other session
      2. Wait for completion
      3. Override: `req approve single_session_per_project`
    checklist:
      - "Confirmed no other active sessions on this project"
  # DEPRECATED: pre_commit_review is deprecated since v2.6.
  # The /pre-commit command remains available for voluntary use.
  # Use /deep-review or /arch-review for enforced review workflows instead.
  pre_commit_review:
    enabled: false
    deprecated: true
    deprecated_message: "pre_commit_review is deprecated. Use /pre-commit voluntarily or /deep-review for enforced pre-PR review."
    type: blocking
    scope: single_use
    description: "Code review before each commit - resets after commit completes."
    trigger_tools:
    - tool: Bash
      command_pattern: git\s+(commit|cherry-pick|revert|merge)
    auto_resolve_skill: "requirements-framework:pre-commit"
    satisfied_by_skill: "requirements-framework:pre-commit"
    message: |
      ## Blocked: pre_commit_review

      **Execute**: `/{auto_resolve_skill}`

      Runs code-reviewer, silent-failure-hunter, and tool-validator agents.
    checklist:
    - Code follows project conventions
    - Error handling is adequate
    - No obvious bugs or issues
  # Review team gate (rename of pre_pr_review): the /deep-review team satisfies
  # this on completion. codex-review is now a CONDITIONAL side-quest on this
  # node (see the workflow: section in requirements.local.yaml), not its own gate.
  pr_reviewed:
    enabled: true
    type: blocking
    scope: single_use
    description: "Comprehensive quality review with the review team before PR creation."
    trigger_tools:
    - tool: Bash
      command_pattern: gh\s+pr\s+create
    auto_resolve_skill: "requirements-framework:deep-review"
    satisfied_by_skill: "requirements-framework:deep-review"
    message: |
      ## Blocked: pr_reviewed

      **Execute**: `/{auto_resolve_skill}`

      Cross-validated team-based review with agent debate.
    checklist:
    - Code has been reviewed for bugs
    - Error handling is complete
    - Tests are adequate (if applicable)
  # Gates `git push` on verification evidence (tests/build), satisfied by the
  # /verification-before-completion skill. single_use: re-armed by
  # clear-single-use after each push.
  # KNOWN FOOT-GUN: command_pattern is a substring regex, so any Bash command
  # containing the literal text "git push" (e.g. an echo or grep) also trips
  # this gate — same naive matching as the commit/PR gates above.
  verified:
    enabled: true
    type: blocking
    scope: single_use
    description: "Verification evidence (tests/build) required before pushing."
    trigger_tools:
    - tool: Bash
      command_pattern: git\s+push
    auto_resolve_skill: "requirements-framework:verification-before-completion"
    satisfied_by_skill: "requirements-framework:verification-before-completion"
    message: |
      ## Blocked: verified

      **Execute**: `/{auto_resolve_skill}`

      Run tests/build and capture verification evidence before pushing.
    checklist:
    - Tests/build run and passing
    - Verification evidence captured

hooks:
  session_start:
    inject_context: true
    briefing_format: compact
  session_learning:
    enabled: true
    prompt_on_stop: true
    min_tool_uses: 5
  stop:
    verify_requirements: true
  plan_enter:
    brainstorm_on_enter: true
inherit: true
